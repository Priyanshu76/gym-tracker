<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/static/js/theme.js"></script>
<title>Page not found — Gym Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17181a; --surface: #1f2022; --line: #35373a;
    --chalk: #f2efe7; --steel: #9aa0a6; --accent: #16e0c5;
  }

  [data-theme="light"]{
    --bg: #f7f6f2; --surface: #ffffff; --surface-2: #eeece6; --line: #ddd9d0;
    --chalk: #1f2022; --steel: #6b6f76; --rust: #c0392b; --green: #3d7a4a; --blue: #3d6199;
  }
  [data-accent="teal"]{ --accent: #16e0c5; }
  [data-accent="blue"]{ --accent: #4a9eff; }
  [data-accent="purple"]{ --accent: #a78bfa; }
  [data-accent="pink"]{ --accent: #f472b6; }
  [data-accent="orange"]{ --accent: #fb923c; }
  [data-accent="coral"]{ --accent: #f87171; }
  [data-accent="green"]{ --accent: #4ade80; }
  [data-accent="yellow"]{ --accent: #fbbf24; }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--chalk); font-family:'Inter', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center;
  }
  .box{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:40px 28px; max-width:380px; }
  .code{ font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--accent); letter-spacing:.1em; margin-bottom:8px; }
  h1{ font-family:'Oswald', sans-serif; font-weight:700; text-transform:uppercase; font-size:22px; margin:0 0 10px; }
  p{ color:var(--steel); font-size:14px; line-height:1.5; margin:0 0 24px; }
  a{
    display:inline-block; background:var(--accent); color:#0a1512; text-decoration:none;
    font-family:'Oswald', sans-serif; font-weight:600; text-transform:uppercase; font-size:12px;
    letter-spacing:.05em; padding:11px 20px; border-radius:6px;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>That link doesn't lead anywhere — it may be mistyped or out of date.</p>
    <a href="/">← Back to Gym Tracker</a>
  </div>
</body>
</html>
