<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — Gym Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17181a; --surface: #1f2022; --surface-2: #26282a; --line: #35373a;
    --chalk: #f2efe7; --steel: #9aa0a6; --yellow: #e8b23c; --rust: #b0472f; --green: #6f9c6a;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--chalk); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased;
        min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .box{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:32px 28px; max-width:380px; width:100%; }
  h1{ font-family:'Oswald', sans-serif; font-weight:700; text-transform:uppercase; font-size:22px; margin:0 0 6px; }
  .sub{ font-size:13.5px; color:var(--steel); margin:0 0 22px; line-height:1.5; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; color:var(--steel); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; font-family:'JetBrains Mono', monospace; }
  .field input{ width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:6px; color:var(--chalk); font-size:14px; padding:10px 12px; }
  .field input:focus{ outline:none; border-color:var(--yellow); }
  .field small{ display:block; color:var(--steel); font-size:11px; margin-top:5px; }
  .submit-btn{
    width:100%; margin-top:6px; padding:12px; border:none; border-radius:6px; background:var(--yellow); color:#1a1a1a;
    font-family:'Oswald', sans-serif; font-weight:600; text-transform:uppercase; font-size:13px; letter-spacing:.05em; cursor:pointer;
  }
  .submit-btn:disabled{ background:var(--line); color:var(--steel); cursor:default; }
  .msg{ font-size:13px; margin-top:14px; text-align:center; min-height:16px; }
  .msg.err{ color:var(--rust); }
  .msg.ok{ color:var(--green); }
  .back-link{ display:block; text-align:center; margin-top:18px; font-size:12px; color:var(--steel); text-decoration:none; }
  .back-link:hover{ color:var(--yellow); }
  .success-box{ text-align:center; }
  .success-box .icon{ font-size:36px; margin-bottom:10px; }
</style>
</head>
<body>
<div class="box" id="box">
  <!-- content injected by JS depending on whether a reset token is present in the URL -->
</div>

<script>
// Same origin as the rest of the app — relative paths, no BASE_URL, no API key.
function extractErrorMessage(data, fallback){
  if(!data) return fallback;
  if(typeof data.detail === 'string') return data.detail;
  if(Array.isArray(data.detail) && data.detail.length) return data.detail.map(d => d.msg).join(' ');
  if(data.error) return data.error;
  return fallback;
}

const box = document.getElementById('box');
const params = new URLSearchParams(location.search);
const token = params.get('token');
const prefillUsername = params.get('username') || '';

function renderRequestForm(){
  box.innerHTML = `
    <h1>Forgot password</h1>
    <p class="sub">Enter your username and we'll email a reset link to the address on file — if that account exists.</p>
    <form id="forgot-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">Send reset link</button>
      <div class="msg" id="msg"></div>
    </form>
    <a class="back-link" href="/">← Back to login</a>
  `;
  const form = document.getElementById('forgot-form');
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Sending…';
    msgEl.textContent = '';
    msgEl.className = 'msg';
    try{
      const res = await fetch('/api/forgot-password', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ username: document.getElementById('username').value.trim() })
      });
      const data = await res.json().catch(()=>({}));
      box.innerHTML = `
        <div class="success-box">
          <div class="icon">✉</div>
          <h1>Check your email</h1>
          <p class="sub">${data.message || 'If that account exists, a reset link has been sent to its registered email.'}</p>
          <a class="back-link" href="/">← Back to login</a>
        </div>
      `;
    }catch(err){
      msgEl.textContent = 'Could not reach the server — check your connection.';
      msgEl.className = 'msg err';
      btn.disabled = false;
      btn.textContent = 'Send reset link';
    }
  });
}

function renderSetPasswordForm(){
  box.innerHTML = `
    <h1>Set a new password</h1>
    <p class="sub">Choose a new password for your account.</p>
    <form id="reset-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username" value="${prefillUsername.replace(/"/g,'&quot;')}">
      </div>
      <div class="field">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" required minlength="8" autocomplete="new-password">
        <small>At least 8 characters.</small>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">Set password</button>
      <div class="msg" id="msg"></div>
    </form>
    <a class="back-link" href="/">← Back to login</a>
  `;
  const form = document.getElementById('reset-form');
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    msgEl.textContent = '';
    msgEl.className = 'msg';
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if(newPassword !== confirmPassword){
      msgEl.textContent = "Passwords don't match.";
      msgEl.className = 'msg err';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try{
      const res = await fetch('/api/reset-password', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          token,
          new_password: newPassword
        })
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok || !data.success){
        msgEl.textContent = extractErrorMessage(data, 'That link may have expired — request a new one.');
        msgEl.className = 'msg err';
        btn.disabled = false;
        btn.textContent = 'Set password';
        return;
      }
      box.innerHTML = `
        <div class="success-box">
          <div class="icon">✓</div>
          <h1>Password updated</h1>
          <p class="sub">You can log in with your new password now.</p>
          <a class="back-link" href="/">← Go to login</a>
        </div>
      `;
    }catch(err){
      msgEl.textContent = 'Could not reach the server — check your connection.';
      msgEl.className = 'msg err';
      btn.disabled = false;
      btn.textContent = 'Set password';
    }
  });
}

if(token){
  renderSetPasswordForm();
} else {
  renderRequestForm();
}
</script>
</body>
</html>
