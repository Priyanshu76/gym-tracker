<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workout Logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17181a;
    --surface: #1f2022;
    --surface-2: #26282a;
    --line: #35373a;
    --chalk: #f2efe7;
    --steel: #9aa0a6;
    --yellow: #e8b23c;
    --rust: #b0472f;
    --green: #6f9c6a;
    --blue: #6a94b0;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--chalk); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:1040px; margin:0 auto; padding:20px 16px 60px; }

  header{ margin-bottom:16px; }
  .header-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--steel); margin:0 0 4px; }
  h1{ font-family:'Oswald', sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.02em; font-size:26px; margin:0; }
  .nav-link{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--steel); text-decoration:none; border:1px solid var(--line); border-radius:20px;
    padding:6px 12px; transition:border-color .15s, color .15s; flex:none; white-space:nowrap;
  }
  .nav-link:hover{ border-color:var(--yellow); color:var(--yellow); }
  .logout-btn{
    background:none; border:1px solid var(--line); color:var(--steel); font-size:11px; font-family:'JetBrains Mono', monospace;
    padding:5px 10px; border-radius:14px; cursor:pointer; text-transform:uppercase; letter-spacing:.05em; margin-left:8px;
  }
  .logout-btn:hover{ border-color:var(--rust); color:var(--rust); }

  .state-msg{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:24px; text-align:center; color:var(--steel); font-size:14px; }
  .state-msg b{ color:var(--chalk); }

  /* ---- Filter bar ---- */
  .filter-bar{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; margin:18px 0; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .tab-btn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--steel); font-family:'Oswald', sans-serif;
    font-weight:600; text-transform:uppercase; font-size:11.5px; letter-spacing:.04em; padding:7px 12px;
    border-radius:18px; cursor:pointer; transition:all .15s ease;
  }
  .tab-btn.active{ background:var(--yellow); border-color:var(--yellow); color:#1a1a1a; }
  .range-pills{ display:flex; gap:4px; background:var(--surface-2); border:1px solid var(--line); border-radius:20px; padding:3px; }
  .range-pill{ background:transparent; border:none; color:var(--steel); font-family:'JetBrains Mono', monospace; font-size:11px; padding:6px 10px; border-radius:16px; cursor:pointer; }
  .range-pill.active{ background:var(--surface); color:var(--chalk); }
  .filter-bar input[type="text"], .filter-bar select{
    background:var(--surface-2); border:1px solid var(--line); color:var(--chalk);
    font-family:'Inter', sans-serif; font-size:13px; padding:8px 10px; border-radius:6px;
  }
  .filter-bar input[type="text"]{ flex:1; min-width:140px; }
  .sort-btn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--steel); font-family:'JetBrains Mono', monospace;
    font-size:11px; padding:8px 12px; border-radius:6px; cursor:pointer; white-space:nowrap;
  }
  .sort-btn:hover{ border-color:var(--yellow); color:var(--yellow); }
  .filter-count{ font-size:12px; color:var(--steel); font-family:'JetBrains Mono', monospace; margin-left:auto; white-space:nowrap; }

  /* ---- Table ---- */
  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:760px; }
  thead th{
    text-align:left; background:var(--surface-2); color:var(--steel); font-family:'JetBrains Mono', monospace;
    font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; padding:10px 12px; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  tbody td{ padding:9px 12px; border-bottom:1px solid var(--line); color:var(--chalk); vertical-align:top; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:var(--surface-2); }
  .sec-badge{
    display:inline-block; font-family:'JetBrains Mono', monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:.05em; padding:2px 8px; border-radius:10px; color:#1a1a1a;
  }
  .sec-badge.main{ background:var(--yellow); }
  .sec-badge.warmup{ background:var(--blue); }
  .sec-badge.stretch{ background:var(--green); }
  .ex-cell .performed-as{ display:block; font-size:11px; color:var(--blue); margin-top:2px; font-family:'JetBrains Mono', monospace; }
  .time-cell{ color:var(--steel); font-family:'JetBrains Mono', monospace; font-size:12px; white-space:nowrap; }
  .details-cell{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--steel); }

  /* ---- Pagination ---- */
  .pagination{ display:flex; align-items:center; justify-content:center; gap:12px; margin-top:16px; }
  .page-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--chalk); font-family:'JetBrains Mono', monospace;
    font-size:12px; padding:7px 14px; border-radius:6px; cursor:pointer;
  }
  .page-btn:disabled{ color:var(--steel); cursor:not-allowed; opacity:.5; }
  .page-info{ font-size:12px; color:var(--steel); font-family:'JetBrains Mono', monospace; }

  /* ---- Login overlay (same pattern as the other pages) ---- */
  .auth-overlay{ position:fixed; inset:0; background:var(--bg); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .auth-overlay.show{ display:flex; }
  .auth-box{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:28px 24px; max-width:340px; width:100%; }
  .auth-box h2{ font-family:'Oswald', sans-serif; text-transform:uppercase; font-size:20px; margin:0 0 4px; }
  .auth-box .sub{ font-size:13px; color:var(--steel); margin:0 0 20px; }
  .auth-field{ margin-bottom:14px; }
  .auth-field label{ display:block; font-size:11px; color:var(--steel); text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; font-family:'JetBrains Mono', monospace; }
  .auth-field input{ width:100%; background:var(--surface-2); border:1px solid var(--line); border-radius:6px; color:var(--chalk); font-size:14px; padding:10px 12px; }
  .auth-field input:focus{ outline:none; border-color:var(--yellow); }
  .auth-submit{ width:100%; margin-top:6px; padding:11px; border:none; border-radius:6px; background:var(--yellow); color:#1a1a1a; font-family:'Oswald', sans-serif; font-weight:600; text-transform:uppercase; font-size:13px; letter-spacing:.05em; cursor:pointer; }
  .auth-submit:disabled{ background:var(--line); color:var(--steel); cursor:default; }
  .auth-error{ color:var(--rust); font-size:12.5px; margin-top:10px; min-height:16px; text-align:center; }
  .auth-links{ text-align:center; margin-top:14px; font-size:12px; }
  .auth-links a{ color:var(--steel); text-decoration:none; }
  .auth-links a:hover{ color:var(--yellow); }
  .auth-links .sep{ color:var(--line); margin:0 6px; }


  @media (max-width:600px){
    .filter-count{ margin-left:0; width:100%; text-align:left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Workout Logs</p>
    <div class="header-top">
      <h1>Every set, warmup & stretch</h1>
      <span><a class="nav-link" href="/dashboard">← Dashboard</a><button class="logout-btn" id="logout-btn" style="display:none;">Log out</button></span>
    </div>
  </header>

  <div id="root"><div class="state-msg">Loading your logs…</div></div>
</div>

<div class="auth-overlay" id="auth-overlay">
  <div class="auth-box">
    <h2>Log in</h2>
    <p class="sub">Accounts are invite-only — ask the site owner for a login.</p>
    <form id="auth-form">
      <div class="auth-field">
        <label for="auth-username">Username</label>
        <input type="text" id="auth-username" autocomplete="username" required>
      </div>
      <div class="auth-field">
        <label for="auth-password">Password</label>
        <input type="password" id="auth-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="auth-submit" id="auth-submit">Log in</button>
      <div class="auth-error" id="auth-error"></div>
    </form>
    <div class="auth-links"><a href="/signup">Sign up</a><span class="sep">·</span><a href="/reset-password">Forgot password?</a></div>
  </div>
</div>

<div class="auth-overlay" id="force-reset-overlay">
  <div class="auth-box">
    <h2>Set a new password</h2>
    <p class="sub">This is a temporary password — choose one only you know before continuing.</p>
    <form id="force-reset-form">
      <div class="auth-field">
        <label for="force-reset-password">New password</label>
        <input type="password" id="force-reset-password" autocomplete="new-password" required minlength="8">
      </div>
      <div class="auth-field">
        <label for="force-reset-confirm">Confirm new password</label>
        <input type="password" id="force-reset-confirm" autocomplete="new-password" required minlength="8">
      </div>
      <button type="submit" class="auth-submit" id="force-reset-submit">Set password</button>
      <div class="auth-error" id="force-reset-error"></div>
    </form>
  </div>
</div>


<script>
// Same origin as the rest of the app — relative paths, no BASE_URL, no API key.

const root = document.getElementById('root');
let ALL_ROWS = [];
let STATE = { section: 'all', range: 'all', search: '', muscleGroup: '', sortDir: 'desc', page: 1 };
const PAGE_SIZE = 50;

// ==================================================================
// AUTH — same pattern as the dashboard and log pages
// ==================================================================
let CURRENT_USER = null;

async function checkMe(){
  try{
    const res = await fetch('/api/me');
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

function ensureAuthed(){
  return new Promise(resolve=>{
    checkMe().then(me=>{
      if(me){ resolve(me); return; }
      showLoginOverlay(resolve);
    });
  });
}

function showForceResetOverlay(me, onSuccess){
  document.getElementById('auth-overlay').classList.remove('show');
  const overlay = document.getElementById('force-reset-overlay');
  const form = document.getElementById('force-reset-form');
  const errEl = document.getElementById('force-reset-error');
  const submitBtn = document.getElementById('force-reset-submit');
  overlay.classList.add('show');

  form.onsubmit = async (e)=>{
    e.preventDefault();
    errEl.textContent = '';
    const newPassword = document.getElementById('force-reset-password').value;
    const confirmPassword = document.getElementById('force-reset-confirm').value;
    if(newPassword !== confirmPassword){
      errEl.textContent = "Passwords don't match.";
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving\u2026';
    try{
      const res = await authFetch('/api/set-new-password', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ new_password: newPassword })
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok || !data.success){
        errEl.textContent = (data.detail || data.error) || 'Could not set password.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set password';
        return;
      }
      overlay.classList.remove('show');
      form.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Set password';
      me.must_reset_password = false;
      onSuccess(me);
    }catch(err){
      errEl.textContent = 'Could not reach the server \u2014 check your connection.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Set password';
    }
  };
}

function completeLogin(me, onSuccess){
  if(me.must_reset_password){
    showForceResetOverlay(me, onSuccess);
  } else {
    document.getElementById('auth-overlay').classList.remove('show');
    onSuccess(me);
  }
}

function showLoginOverlay(onSuccess){
  const overlay = document.getElementById('auth-overlay');
  const form = document.getElementById('auth-form');
  const errEl = document.getElementById('auth-error');
  const submitBtn = document.getElementById('auth-submit');
  overlay.classList.add('show');

  form.onsubmit = async (e)=>{
    e.preventDefault();
    errEl.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in\u2026';
    const username = document.getElementById('auth-username').value.trim();
    const password = document.getElementById('auth-password').value;
    try{
      const res = await fetch('/api/login', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json().catch(()=>({}));
      if(!res.ok || !data.success){
        errEl.textContent = (data.detail || data.error) || 'Login failed \u2014 check your username and password.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
        return;
      }
      const me = await checkMe();
      form.reset();
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
      completeLogin(me, onSuccess);
    }catch(err){
      errEl.textContent = 'Could not reach the server \u2014 check your connection.';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  };
}

async function authFetch(path, opts={}){
  const res = await fetch(path, opts);
  if(res.status === 401){
    await ensureAuthed();
    return authFetch(path, opts);
  }
  return res;
}

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  try{ await fetch('/api/logout', { method:'POST' }); }catch(e){}
  location.reload();
});

// ==================================================================
// LOAD
// ==================================================================
function daysAgo(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

async function load(){
  await ensureAuthed();
  document.getElementById('logout-btn').style.display = 'inline-block';

  let rows;
  try{
    const res = await authFetch('/api/workout-logs');
    if(!res.ok) throw new Error('status ' + res.status);
    rows = await res.json();
  }catch(e){
    root.innerHTML = `<div class="state-msg">Couldn't reach the logs endpoint.<br><b>Check the server is running</b> and you're logged in.</div>`;
    return;
  }

  ALL_ROWS = (rows || [])
    .filter(r => r.exercise && r.workout_date)
    .map(r => ({
      date: r.workout_date,
      day: r.day_name,
      timestamp: r.logged_at,
      section: r.section || 'Main',
      exercise: r.exercise,
      performedAs: r.performed_as || '',
      muscleGroup: r.muscle_group,
      setNumber: r.set_number,
      weight: r.weight_kg != null ? Number(r.weight_kg) : null,
      reps: r.reps,
      field1Label: r.metrics ? Object.keys(r.metrics)[0] || '' : '',
      field1Value: r.metrics ? Object.values(r.metrics)[0] || '' : '',
      field2Label: r.metrics ? Object.keys(r.metrics)[1] || '' : '',
      field2Value: r.metrics ? Object.values(r.metrics)[1] || '' : '',
      field3Label: r.metrics ? Object.keys(r.metrics)[2] || '' : '',
      field3Value: r.metrics ? Object.values(r.metrics)[2] || '' : '',
    }));

  if(ALL_ROWS.length === 0){
    root.innerHTML = `<div class="state-msg">No sets logged yet.<br><b>Log a workout</b> from the Weekly Lift Log page and check back here.</div>`;
    return;
  }

  // sort by timestamp when available (precise), falling back to date only
  ALL_ROWS.sort((a,b)=> (a.timestamp || a.date).localeCompare(b.timestamp || b.date));

  buildShell();
  renderTable();
}

function buildShell(){
  const muscleGroups = [...new Set(ALL_ROWS.filter(r=>r.muscleGroup).map(r=>r.muscleGroup))].sort();

  root.innerHTML = `
    <div class="filter-bar">
      <div class="tabs" id="section-tabs">
        <button class="tab-btn" data-section="all">All</button>
        <button class="tab-btn" data-section="Main">Main</button>
        <button class="tab-btn" data-section="Warmup">Warmup</button>
        <button class="tab-btn" data-section="Stretch">Stretch</button>
      </div>
      <div class="range-pills" id="range-pills">
        <button class="range-pill" data-range="7">7D</button>
        <button class="range-pill" data-range="30">30D</button>
        <button class="range-pill" data-range="90">90D</button>
        <button class="range-pill" data-range="all">All</button>
      </div>
      <select id="mg-filter"><option value="">All muscle groups</option>${muscleGroups.map(m=>`<option value="${m}">${m}</option>`).join('')}</select>
      <input type="text" id="search-input" placeholder="Search exercise name…">
      <button class="sort-btn" id="sort-btn">Newest first ↓</button>
      <span class="filter-count" id="filter-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Time</th><th>Day</th><th>Section</th><th>Exercise</th><th>Muscle Group</th><th>Details</th>
          </tr>
        </thead>
        <tbody id="log-tbody"></tbody>
      </table>
    </div>
    <div class="pagination" id="pagination"></div>
  `;

  document.getElementById('section-tabs').addEventListener('click', e=>{
    const btn = e.target.closest('.tab-btn');
    if(!btn) return;
    STATE.section = btn.dataset.section;
    STATE.page = 1;
    renderTable();
  });
  document.getElementById('range-pills').addEventListener('click', e=>{
    const btn = e.target.closest('.range-pill');
    if(!btn) return;
    STATE.range = btn.dataset.range;
    STATE.page = 1;
    renderTable();
  });
  document.getElementById('mg-filter').addEventListener('change', e=>{
    STATE.muscleGroup = e.target.value;
    STATE.page = 1;
    renderTable();
  });
  document.getElementById('search-input').addEventListener('input', e=>{
    STATE.search = e.target.value.trim().toLowerCase();
    STATE.page = 1;
    renderTable();
  });
  document.getElementById('sort-btn').addEventListener('click', ()=>{
    STATE.sortDir = STATE.sortDir === 'desc' ? 'asc' : 'desc';
    document.getElementById('sort-btn').textContent = STATE.sortDir === 'desc' ? 'Newest first ↓' : 'Oldest first ↑';
    renderTable();
  });

  STATE.section = 'all';
  STATE.range = 'all';
  syncFilterUI();
}

function syncFilterUI(){
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.section===STATE.section));
  document.querySelectorAll('.range-pill').forEach(b=> b.classList.toggle('active', b.dataset.range===STATE.range));
}

function detailsFor(r){
  if(r.section === 'Main'){
    const parts = [];
    if(r.setNumber) parts.push(`Set ${r.setNumber}`);
    if(r.weight != null) parts.push(`${r.weight} kg`);
    if(r.reps != null) parts.push(`× ${r.reps} reps`);
    return parts.join(' — ');
  }
  const fields = [
    [r.field1Label, r.field1Value],
    [r.field2Label, r.field2Value],
    [r.field3Label, r.field3Value],
  ].filter(([l,v]) => l && v !== '');
  return fields.map(([l,v])=>`${l}: ${v}`).join(' • ') || '—';
}

function renderTable(){
  syncFilterUI();

  let rows = ALL_ROWS.slice();

  if(STATE.section !== 'all') rows = rows.filter(r=>r.section===STATE.section);
  if(STATE.range !== 'all'){
    const cutoff = daysAgo(Number(STATE.range));
    rows = rows.filter(r=>r.date >= cutoff);
  }
  if(STATE.muscleGroup) rows = rows.filter(r=>r.muscleGroup===STATE.muscleGroup);
  if(STATE.search){
    rows = rows.filter(r =>
      (r.exercise||'').toLowerCase().includes(STATE.search) ||
      (r.performedAs||'').toLowerCase().includes(STATE.search)
    );
  }

  rows.sort((a,b)=>{
    const ka = a.timestamp || a.date, kb = b.timestamp || b.date;
    return STATE.sortDir === 'desc' ? kb.localeCompare(ka) : ka.localeCompare(kb);
  });

  const total = rows.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  STATE.page = Math.min(STATE.page, totalPages);
  const startIdx = (STATE.page - 1) * PAGE_SIZE;
  const pageRows = rows.slice(startIdx, startIdx + PAGE_SIZE);

  document.getElementById('filter-count').textContent = `${total} entr${total===1?'y':'ies'}`;

  const tbody = document.getElementById('log-tbody');
  if(pageRows.length === 0){
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--steel);padding:24px;">No entries match these filters.</td></tr>`;
  } else {
    tbody.innerHTML = pageRows.map(r=>{
      const timeStr = r.timestamp ? new Date(r.timestamp).toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'}) : '—';
      const secClass = r.section === 'Main' ? 'main' : r.section === 'Warmup' ? 'warmup' : 'stretch';
      return `
        <tr>
          <td>${r.date}</td>
          <td class="time-cell">${timeStr}</td>
          <td>${r.day || '—'}</td>
          <td><span class="sec-badge ${secClass}">${r.section}</span></td>
          <td class="ex-cell">${r.exercise}${r.performedAs ? `<span class="performed-as">as ${r.performedAs}</span>` : ''}</td>
          <td>${r.muscleGroup || '—'}</td>
          <td class="details-cell">${detailsFor(r)}</td>
        </tr>
      `;
    }).join('');
  }

  const pagEl = document.getElementById('pagination');
  if(totalPages <= 1){
    pagEl.innerHTML = '';
  } else {
    pagEl.innerHTML = `
      <button class="page-btn" id="prev-page" ${STATE.page<=1?'disabled':''}>← Prev</button>
      <span class="page-info">Page ${STATE.page} of ${totalPages}</span>
      <button class="page-btn" id="next-page" ${STATE.page>=totalPages?'disabled':''}>Next →</button>
    `;
    document.getElementById('prev-page')?.addEventListener('click', ()=>{ STATE.page--; renderTable(); });
    document.getElementById('next-page')?.addEventListener('click', ()=>{ STATE.page++; renderTable(); });
  }
}

load();
</script>
</body>
</html>
