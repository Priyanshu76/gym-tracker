<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/static/js/theme.js"></script>
<title>My Plan — Gym Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17181a; --surface: #1f2022; --surface-2: #26282a; --line: #35373a;
    --chalk: #f2efe7; --steel: #9aa0a6; --accent: #16e0c5; --rust: #b0472f; --green: #6f9c6a; --blue: #6a94b0;
  }

  [data-theme="light"]{
    --bg: #f7f6f2; --surface: #ffffff; --surface-2: #eeece6; --line: #ddd9d0;
    --chalk: #1f2022; --steel: #6b6f76; --rust: #c0392b; --green: #3d7a4a; --blue: #3d6199;
  }
  [data-accent="teal"]{ --accent: #16e0c5; }
  [data-accent="blue"]{ --accent: #4a9eff; }
  [data-accent="purple"]{ --accent: #a78bfa; }
  [data-accent="pink"]{ --accent: #f472b6; }
  [data-accent="orange"]{ --accent: #fb923c; }
  [data-accent="coral"]{ --accent: #f87171; }
  [data-accent="green"]{ --accent: #4ade80; }
  [data-accent="yellow"]{ --accent: #fbbf24; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--chalk); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:76px; }
  .wrap{ max-width:760px; margin:0 auto; padding:20px 16px 60px; }

  .app-topbar{
    position:sticky; top:0; z-index:25;
    background:rgba(31,32,34,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  [data-theme="light"] .app-topbar{ background:rgba(255,255,255,.92); }
  .app-topbar-inner{ max-width:760px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; }
  .app-name{ font-family:'Oswald', sans-serif; font-weight:700; text-transform:uppercase; font-size:16px; letter-spacing:.06em; color:var(--chalk); }
  .app-topbar-right{ display:flex; align-items:center; gap:10px; }
  .app-icon-btn{
    width:36px; height:36px; border-radius:50%; background:var(--surface-2);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    color:var(--chalk); text-decoration:none; transition:border-color .15s ease, color .15s ease;
  }
  .app-icon-btn:hover{ border-color:var(--accent); color:var(--accent); }

  .app-tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:25;
    display:flex; background:rgba(31,32,34,.96); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);
  }
  [data-theme="light"] .app-tabbar{ background:rgba(255,255,255,.96); }
  .app-tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:9px 4px 8px; text-decoration:none; color:var(--steel);
    font-family:'JetBrains Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:.03em;
    transition:color .15s ease;
  }
  .app-tab.active{ color:var(--accent); }
  .app-tab:active{ opacity:.6; }
  .page-head{ margin-bottom:16px; }
  header{ margin-bottom:18px; }
  .header-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--steel); margin:0 0 4px; }
  h1{ font-family:'Oswald', sans-serif; font-weight:700; text-transform:uppercase; font-size:24px; margin:0; }
  .nav-link{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--steel); text-decoration:none; border:1px solid var(--line); border-radius:20px; padding:6px 12px; }
  .nav-link:hover{ border-color:var(--accent); color:var(--accent); }
  .state-msg{ background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:24px; text-align:center; color:var(--steel); font-size:14px; }
  .import-msg{ font-size:12px; min-height:14px; }
  .import-msg.ok{ color:var(--green); }
  .import-msg.err{ color:var(--rust); }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .card.active{ border-color:var(--green); }
  .plan-name{ font-family:'Oswald', sans-serif; font-weight:600; text-transform:uppercase; font-size:15px; margin:0 0 8px; }
  .day-row{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .day-row:last-child{ border-bottom:none; }
  .day-row .label{ color:var(--steel); }
  .day-row.rest .label, .day-row.rest .val{ color:var(--steel); font-style:italic; }
  .btn{
    border:none; border-radius:12px; padding:11px 16px; font-family:'Oswald', sans-serif; font-weight:600;
    text-transform:uppercase; font-size:12px; letter-spacing:.05em; cursor:pointer; display:inline-flex;
    align-items:center; gap:6px; transition:transform .08s ease, box-shadow .08s ease;
  }
  .btn-primary{ background:var(--accent); color:#0a1512; box-shadow:0 4px 0 0 rgba(0,0,0,.28); }
  .btn-primary:active{ transform:translateY(3px); box-shadow:0 1px 0 0 rgba(0,0,0,.28); }
  .btn-secondary{ background:var(--surface-2); color:var(--chalk); border:1px solid var(--line); box-shadow:0 3px 0 0 rgba(0,0,0,.2); }
  .btn-secondary:active{ transform:translateY(2px); box-shadow:0 1px 0 0 rgba(0,0,0,.2); }
  .btn:disabled{ background:var(--line); color:var(--steel); cursor:default; box-shadow:none; transform:none; }
  .active-tag{ display:inline-block; font-family:'JetBrains Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:#1a1a1a; background:var(--green); padding:3px 8px; border-radius:10px; margin-left:8px; }
  .section-head{ margin:24px 0 12px; font-family:'Oswald', sans-serif; text-transform:uppercase; font-size:15px; }
</style>
<script src="/static/js/icons.js"></script>
</head>
<body>
<header class="app-topbar">
  <div class="app-topbar-inner">
    <span class="app-name">Gym Tracker</span>
    <div class="app-topbar-right">
      <a href="/admin" class="app-icon-btn" aria-label="Admin" id="admin-nav-link" style="display:none;"></a>
      <a href="/profile" class="app-icon-btn" aria-label="Profile"></a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="page-head">
    <h1>My Plan</h1>
  </div>
  <div id="root"><div class="state-msg">Loading…</div></div>

  <div class="section-head" style="margin-top:28px;">Import a shared plan</div>
  <div class="card">
    <p style="font-size:12.5px; color:var(--steel); margin:0 0 10px;">Received a plan file from someone else? Importing adds it as a new option — it never touches your existing plans.</p>
    <input type="file" id="import-file-input" accept="application/json" style="display:none;">
    <button class="btn btn-secondary" onclick="document.getElementById('import-file-input').click()">${icon('plus',14)} Choose plan file</button>
    <div id="import-msg" class="import-msg" style="margin-top:8px;"></div>
  </div>
</div>

<script>
async function checkMe(){
  try{ const r = await fetch('/api/me'); return r.ok ? await r.json() : null; }catch(e){ return null; }
}

function renderDayRow(day){
  if(day.is_rest){
    return `<div class="day-row rest"><span class="label">${day.day_name}</span><span class="val">Rest</span></div>`;
  }
  const names = day.exercises.map(e=>e.name).join(', ');
  return `<div class="day-row"><span class="label">${day.day_name} — ${day.split_label}</span><span class="val">${day.exercises.length} exercises</span></div>
          <div style="font-size:11px;color:var(--steel);margin:-4px 0 6px;">${names}</div>`;
}

async function activate(id){
  await fetch(`/api/plans/${id}/activate`, { method:'PATCH' });
  location.href = '/';
}

async function deactivate(){
  await fetch('/api/plans/deactivate', { method:'PATCH' });
  location.reload();
}

async function generate(){
  const root = document.getElementById('root');
  root.innerHTML = '<div class="state-msg">Generating your plan options…</div>';
  const res = await fetch('/api/plans/generate', { method:'POST' });
  if(!res.ok){
    const data = await res.json().catch(()=>({}));
    root.innerHTML = `<div class="state-msg">${(data.detail) || 'Could not generate a plan.'} ${res.status===400?'<br><a class="nav-link" href="/profile" style="margin-top:10px;display:inline-block;">Complete your profile →</a>':''}</div>`;
    return;
  }
  const options = await res.json();
  renderOptions(options, null);
}

function renderOptions(options, activePlan){
  const root = document.getElementById('root');
  root.innerHTML = `
    ${activePlan ? `
      <div class="card active">
        <div class="plan-name">${activePlan.name} <span class="active-tag">Active</span></div>
        ${activePlan.days.map(renderDayRow).join('')}
        <button class="btn btn-secondary" style="margin-top:12px;" onclick="deactivate()">${icon('arrowLeft',14)} Switch to classic plan</button>
      </div>
    ` : ''}
    <div class="section-head">${activePlan ? 'Generate a new set of options' : 'Choose a personalized plan'}</div>
    <div id="options-list">
      ${options.map(opt => `
        <div class="card">
          <div class="plan-name">${opt.name}</div>
          ${opt.days.map(renderDayRow).join('')}
          <button class="btn btn-primary" style="margin-top:12px;" onclick="activate('${opt.id}')">${icon('check',14)} Use this plan</button>
        </div>
      `).join('')}
    </div>
    <button class="btn btn-secondary" onclick="generate()">${icon('refresh',14)} Generate 3 new options</button>
  `;
}

document.getElementById('import-file-input').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const msgEl = document.getElementById('import-msg');
  msgEl.textContent = 'Importing…';
  msgEl.className = 'import-msg';
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    // Accepts either a full-account export (uses the first plan found) or a single-plan object directly.
    const planPayload = parsed.plans ? parsed.plans[0] : parsed;
    if(!planPayload || !planPayload.name || !planPayload.days){
      throw new Error('not a recognizable plan file');
    }
    const res = await fetch('/api/export/plans/import', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(planPayload),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || 'import failed');
    const skipped = data.skipped_exercises || [];
    msgEl.textContent = skipped.length
      ? `Imported — ${skipped.length} exercise(s) not found in the library and were skipped.`
      : 'Imported! Check the list above to activate it.';
    msgEl.className = 'import-msg ok';
    init();
  }catch(err){
    msgEl.textContent = 'Could not import — make sure this is a valid exported plan file.';
    msgEl.className = 'import-msg err';
  }
  e.target.value = '';
});

async function init(){
  const me = await checkMe();
  if(!me){ location.href = '/'; return; }
  if(!me.has_profile){ location.href = '/onboarding'; return; }
  if(me.is_admin){ document.getElementById('admin-nav-link').style.display = 'flex'; }

  const root = document.getElementById('root');
  const activeRes = await fetch('/api/plans/active');
  const activePlan = activeRes.ok ? await activeRes.json() : null;

  if(activePlan){
    root.innerHTML = `
      <div class="card active">
        <div class="plan-name">${activePlan.name} <span class="active-tag">Active</span></div>
        ${activePlan.days.map(renderDayRow).join('')}
        <button class="btn btn-secondary" style="margin-top:12px;" onclick="deactivate()">${icon('arrowLeft',14)} Switch to classic plan</button>
      </div>
      <button class="btn btn-primary" onclick="generate()">${icon('refresh',14)} Generate new options</button>
    `;
  } else {
    root.innerHTML = `
      <div class="state-msg">You're currently using the classic fixed plan.<br><br>
      <button class="btn btn-primary" onclick="generate()">${icon('target',14)} Generate a plan based on my goals</button></div>
    `;
  }
}
init();
</script>

<nav class="app-tabbar">
  <a href="/" class="app-tab">Log</a>
  <a href="/dashboard" class="app-tab">Stats</a>
  <a href="/plans" class="app-tab active">Plan</a>
  <a href="/logs" class="app-tab">History</a>
</nav>
</body>
</html>
