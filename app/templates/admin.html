<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Gym Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="/static/js/icons.js"></script>
<style>
  :root{
    --bg: #17181a; --surface: #1f2022; --surface-2: #26282a; --line: #35373a;
    --chalk: #f2efe7; --steel: #9aa0a6; --accent: #16e0c5; --rust: #b0472f; --green: #6f9c6a;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--chalk); font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:820px; margin:0 auto; padding:20px 16px 60px; }
  header{ margin-bottom:20px; }
  .header-top{ display:flex; align-items:center; justify-content:space-between; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--steel); margin:0 0 4px; }
  h1{ font-family:'Oswald', sans-serif; font-weight:700; text-transform:uppercase; font-size:24px; margin:0; }
  .nav-link{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--steel); text-decoration:none; border:1px solid var(--line); border-radius:20px; padding:6px 12px; }
  .nav-link:hover{ border-color:var(--accent); color:var(--accent); }
  .section-head{ margin:26px 0 12px; font-family:'Oswald', sans-serif; text-transform:uppercase; font-size:15px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .row .name{ font-weight:600; font-size:14px; }
  .row .meta{ font-size:11.5px; color:var(--steel); font-family:'JetBrains Mono', monospace; }
  .badge{ display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.05em; padding:2px 8px; border-radius:10px; font-family:'JetBrains Mono', monospace; }
  .badge.admin{ background:rgba(22,224,197,.15); color:var(--accent); }
  .badge.disabled{ background:rgba(176,71,47,.15); color:var(--rust); }
  .btn{ border:none; border-radius:6px; padding:7px 12px; font-family:'Oswald', sans-serif; font-weight:600; text-transform:uppercase; font-size:11px; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .btn-approve{ background:var(--green); color:#0a1512; }
  .btn-reject, .btn-disable{ background:none; border:1px solid var(--rust); color:var(--rust); }
  .btn-enable{ background:none; border:1px solid var(--accent); color:var(--accent); }
  .state-msg{ color:var(--steel); font-size:13px; text-align:center; padding:20px; }
  .denied{ text-align:center; padding:60px 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-top">
      <div>
        <p class="eyebrow">Gym Tracker</p>
        <h1>Admin</h1>
      </div>
      <a class="nav-link" href="/">← Back</a>
    </div>
  </header>
  <div id="root"><div class="state-msg">Loading…</div></div>
</div>

<script>
async function checkMe(){
  try{ const r = await fetch('/api/me'); return r.ok ? await r.json() : null; }catch(e){ return null; }
}

async function loadPending(){
  const res = await fetch('/api/admin/pending-signups');
  if(!res.ok) return [];
  return res.json();
}

async function loadUsers(){
  const res = await fetch('/api/admin/users');
  if(!res.ok) return [];
  return res.json();
}

async function approveSignup(id){
  await fetch(`/api/admin/pending-signups/${id}/approve`, { method:'POST' });
  render();
}
async function rejectSignup(id){
  await fetch(`/api/admin/pending-signups/${id}/reject`, { method:'POST' });
  render();
}
async function toggleUser(id, disable){
  await fetch(`/api/admin/users/${id}/${disable ? 'disable' : 'enable'}`, { method:'PATCH' });
  render();
}

function timeAgo(iso){
  if(!iso) return 'never';
  const diffMs = Date.now() - new Date(iso).getTime();
  const days = Math.floor(diffMs / 86400000);
  if(days === 0) return 'today';
  if(days === 1) return 'yesterday';
  return `${days} days ago`;
}

async function render(){
  const root = document.getElementById('root');
  const [pending, users] = await Promise.all([loadPending(), loadUsers()]);

  root.innerHTML = `
    <div class="section-head">Pending signups (${pending.length})</div>
    ${pending.length === 0 ? '<div class="card"><div class="state-msg">Nothing waiting on approval.</div></div>' : pending.map(p => `
      <div class="card">
        <div class="row">
          <div>
            <div class="name">${p.display_name} <span class="meta">@${p.username}</span></div>
            <div class="meta">${p.email}</div>
          </div>
          <div>
            <button class="btn btn-approve" onclick="approveSignup('${p.id}')">${icon('check',12)} Approve</button>
            <button class="btn btn-reject" onclick="rejectSignup('${p.id}')">${icon('trash',12)} Reject</button>
          </div>
        </div>
      </div>
    `).join('')}

    <div class="section-head">All users (${users.length})</div>
    ${users.map(u => `
      <div class="card">
        <div class="row">
          <div>
            <div class="name">${u.display_name} <span class="meta">@${u.username}</span>
              ${u.is_admin ? '<span class="badge admin">Admin</span>' : ''}
              ${u.is_disabled ? '<span class="badge disabled">Disabled</span>' : ''}
            </div>
            <div class="meta">${u.email} · last active: ${timeAgo(u.last_active)}</div>
          </div>
          <div>
            ${u.is_disabled
              ? `<button class="btn btn-enable" onclick="toggleUser('${u.id}', false)">${icon('check',12)} Enable</button>`
              : `<button class="btn btn-disable" onclick="toggleUser('${u.id}', true)">${icon('trash',12)} Disable</button>`}
          </div>
        </div>
      </div>
    `).join('')}
  `;
}

(async function init(){
  const me = await checkMe();
  if(!me){ location.href = '/'; return; }

  const check = await fetch('/api/admin/users');
  if(check.status === 403){
    document.getElementById('root').innerHTML = `<div class="denied">${icon('lock',32)}<p style="margin-top:12px;color:var(--steel);">You don't have admin access.</p></div>`;
    return;
  }
  render();
})();
</script>
</body>
</html>
