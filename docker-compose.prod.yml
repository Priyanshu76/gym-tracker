services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gymuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gymtracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymuser -d gymtracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No "ports:" mapping to the host — Postgres is only reachable from the
    # api container over Docker's internal network, never from the internet.

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://gymuser:${POSTGRES_PASSWORD}@db:5432/gymtracker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # No bind-mounted ./app volume and no --reload here — production runs
    # exactly what was built into the image, not live-editable local code.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  # Adminer is bound to 127.0.0.1 only — this port is never reachable from
  # the internet, even if OCI's security list allowed it, because it's not
  # bound to 0.0.0.0. Access it via an SSH tunnel from your own machine
  # (see the "Viewing the production database" section in DEPLOYMENT.md).
  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
